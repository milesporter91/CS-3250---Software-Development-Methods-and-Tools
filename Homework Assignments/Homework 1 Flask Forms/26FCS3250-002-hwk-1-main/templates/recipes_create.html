{% extends 'base.html' %}
{% block main %}
        <form action="" method="POST" novalidate>
            {{ form.hidden_tag() }}
            <p>{{ form.number.label }} {{ form.number() }}</p>
            <p>{{ form.title.label }} {{ form.title() }}</p>
            <p>{{ form.type.label }} {{ form.type() }}</p>
            <p>{{ form.tags.label }} {{ form.tags() }}</p>
            <p>{{ form.submit() }}</p>
        </form>
{% endblock %}
